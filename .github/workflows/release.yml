name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > keystore.properties << PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Build
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest
      - name: Rename artifact
        run: cp app/build/outputs/apk/release/app-release.apk encrier-${{ github.ref_name }}.apk
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: encrier-${{ github.ref_name }}.apk
          generate_release_notes: true
